                <button onclick="mutateBlockData('${slot.id}', data => { if(data.cells[0].length>2) data.cells.forEach(r => r.pop()); })" class="ribbon-btn-sm border border-slate-200">- Coluna</button>
              </div>
              <div class="ribbon-group-title">Tabela</div>
            </div>
          `;
          break;

        case 'mapa_mental':
          html += `
            <div class="ribbon-group">
              <div class="ribbon-group-content gap-2">
                <button onclick="mutateBlockData('${slot.id}', data => { if(data.branches.length<8) data.branches.push({title:'', blank:false}); })" class="ribbon-btn-sm border border-blue-300 text-blue-700">+ Ramo</button>
                <button onclick="mutateBlockData('${slot.id}', data => { if(data.branches.length>2) data.branches.pop(); })" class="ribbon-btn-sm border border-slate-300">- Ramo</button>
              </div>
              <div class="ribbon-group-title">Mapa Mental</div>
            </div>
          `;
          break;

        case 'linha_tempo':
          html += `
            <div class="ribbon-group">
              <div class="ribbon-group-content gap-2">
                <button onclick="mutateBlockData('${slot.id}', data => { if(data.events.length<6) data.events.push({date:'Data', img:'', label:'', hideLabel:false}); })" class="ribbon-btn-sm border border-blue-300 text-blue-700">+ Marco</button>
                <button onclick="mutateBlockData('${slot.id}', data => { if(data.events.length>2) data.events.pop(); })" class="ribbon-btn-sm border border-slate-300">- Marco</button>
                <span class="text-[11px] text-slate-500 bg-slate-100 px-2 py-1 rounded">Clique no quadro de foto do marco para subir imagem!</span>
              </div>
              <div class="ribbon-group-title">Linha do Tempo</div>
            </div>
          `;
          break;

        case 'imagem_quadro':
          html += `
            <div class="ribbon-group">
              <div class="ribbon-group-content gap-2">
                <button onclick="pickImageFor(url => mutateBlockData('${slot.id}', data => { data.mode='image'; data.imageUrl=url; }))" class="ribbon-btn-sm border border-blue-300 text-blue-700">Subir Imagem</button>
                <button onclick="updateBlockProp('${slot.id}', 'mode', 'drawing')" class="ribbon-btn-sm border border-slate-300">Quadro de Desenho</button>
                <span class="text-xs">Altura (cm):</span>
                <input type="number" min="2" max="15" step="0.5" value="${d.boxHeightCm || 4}" onchange="updateBlockProp('${slot.id}', 'boxHeightCm', parseFloat(this.value)||4)" class="border border-slate-300 rounded w-14 text-center py-0.5 text-xs">
                <label class="flex items-center gap-1 text-xs cursor-pointer">
                  <input type="checkbox" ${d.photocopyFilter ? 'checked' : ''} onchange="updateBlockProp('${slot.id}', 'photocopyFilter', this.checked)">
                  <span>Filtro Fotocópia</span>
                </label>
              </div>
              <div class="ribbon-group-title">Imagem e Quadro</div>
            </div>
          `;
          break;

        case 'tirinha_hq':
          html += `
            <div class="ribbon-group">
              <div class="ribbon-group-content gap-2">
                <select onchange="updateBlockProp('${slot.id}', 'framesCount', parseInt(this.value))" class="border border-slate-300 rounded px-2 py-1 text-xs font-bold bg-white">
                  <option value="1" ${d.framesCount === 1 ? 'selected' : ''}>1 Quadro</option>
                  <option value="2" ${d.framesCount === 2 ? 'selected' : ''}>2 Quadros</option>
                  <option value="3" ${d.framesCount === 3 ? 'selected' : ''}>3 Quadros</option>
                  <option value="4" ${d.framesCount === 4 ? 'selected' : ''}>4 Quadros</option>
                </select>
                <label class="flex items-center gap-1 text-xs cursor-pointer">
                  <input type="checkbox" ${d.speechBubbles ? 'checked' : ''} onchange="updateBlockProp('${slot.id}', 'speechBubbles', this.checked)">
                  <span>Balões de Fala</span>
                </label>
              </div>
              <div class="ribbon-group-title">Tirinha HQ</div>
            </div>
          `;
          break;
      }

      return html;
    }

    /* ============================================================================
       7. OPERAÇÕES DE DADOS E PAGINAÇÃO REAL CORRIGIDA (EMPILHAMENTO CONTÍNUO)
       ============================================================================ */
    function updateDocTitle(val) {
      const doc = getCurrentDoc();
      if (!doc) return;
      doc.title = val;
      doc.updatedAt = Date.now();
      saveStorage();
    }

    function updateDocSubject(subjKey) {
      const doc = getCurrentDoc();
      if (!doc) return;
      doc.subject = subjKey;
      doc.updatedAt = Date.now();
      saveStorage();
    }

    function updateFooterSetting(key, val) {
      const doc = getCurrentDoc();
      if (!doc) return;
      doc.settings[key] = val;
      doc.updatedAt = Date.now();
      saveStorage();
      document.querySelectorAll('.footer-left-span').forEach(el => el.textContent = doc.settings.footerLeft || '');
      document.querySelectorAll('.footer-center-span').forEach(el => el.textContent = doc.settings.footerCenter || '');
      document.querySelectorAll('.footer-page-span').forEach((el, idx, arr) => {
        el.textContent = doc.settings.showPageNumbers ? `Página ${idx + 1} de ${arr.length}` : '';
      });
    }

    function parseLayoutSpans(layoutStr) {
      return layoutStr.split('-').map(n => parseInt(n, 10));
    }

    function addRowWithLayout(layoutStr = '12') {
      const doc = getCurrentDoc();
      if (!doc) return;
      const spans = parseLayoutSpans(layoutStr);
      const newRow = {
        id: uid(),
        layout: layoutStr,
        minHeightCm: 0,
        slots: spans.map(sp => ({ id: uid(), span: sp, block: null }))
      };
      doc.rows.push(newRow);
      state.selectedRowId = newRow.id;
      state.selectedSlotId = newRow.slots[0].id;
      doc.updatedAt = Date.now();
      saveStorage();
      renderEditorAll();
    }

    function changeRowLayout(rowId, newLayoutStr) {
      const doc = getCurrentDoc();
      if (!doc) return;
      const row = doc.rows.find(r => r.id === rowId);
      if (!row) return;
      const spans = parseLayoutSpans(newLayoutStr);
      row.layout = newLayoutStr;
      row.slots = spans.map((sp, i) => ({
        id: row.slots[i]?.id || uid(),
        span: sp,
        block: row.slots[i]?.block || null
      }));
      state.selectedSlotId = row.slots[0].id;
      saveStorage();
      renderEditorAll();
    }

    function moveRow(rowId, dir) {
      const doc = getCurrentDoc();
      if (!doc) return;
      const idx = doc.rows.findIndex(r => r.id === rowId);
      if (idx < 0) return;
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= doc.rows.length) return;
      const [removed] = doc.rows.splice(idx, 1);
      doc.rows.splice(targetIdx, 0, removed);
      saveStorage();
      renderCanvasPages();
    }

    function duplicateRow(rowId) {
      const doc = getCurrentDoc();
      if (!doc) return;
      const idx = doc.rows.findIndex(r => r.id === rowId);
      if (idx < 0) return;
      const clone = JSON.parse(JSON.stringify(doc.rows[idx]));
      clone.id = uid();
      clone.slots.forEach(s => s.id = uid());
      doc.rows.splice(idx + 1, 0, clone);
      state.selectedRowId = clone.id;
      state.selectedSlotId = clone.slots[0].id;
      saveStorage();
      renderEditorAll();
    }

    function deleteRow(rowId) {
      const doc = getCurrentDoc();
      if (!doc) return;
      if (doc.rows.length <= 1) {
        doc.rows[0].slots.forEach(s => s.block = null);
      } else {
        doc.rows = doc.rows.filter(r => r.id !== rowId);
      }
      state.selectedRowId = doc.rows[0]?.id || null;
      state.selectedSlotId = doc.rows[0]?.slots[0]?.id || null;
      saveStorage();
      renderEditorAll();
    }

    function clearSlotBlock(slotId) {
      const doc = getCurrentDoc();
      if (!doc) return;
      for (const r of doc.rows) {
        for (const s of r.slots) {
          if (s.id === slotId) s.block = null;
        }
      }
      state.activeRibbonTab = 'inserir';
      saveStorage();
      renderEditorAll();
    }

    function selectSlot(rowId, slotId, ev) {
      if (ev) ev.stopPropagation();
      state.selectedRowId = rowId;
      state.selectedSlotId = slotId;

      const sel = getSelectedSlotObj();
      if (sel && sel.slot.block) {
        state.activeRibbonTab = 'formatar';
      } else if (state.activeRibbonTab === 'formatar') {
        state.activeRibbonTab = 'inserir';
      }

      document.querySelectorAll('.bento-row').forEach(el => {
        el.classList.toggle('selected-row', el.dataset.rowId === rowId);
      });
      document.querySelectorAll('.bento-slot').forEach(el => {
        el.classList.toggle('active-slot', el.dataset.slotId === slotId);
      });

      renderRibbonHeader();
    }

    function handleWorkspaceBackgroundClick(ev) {
      if (ev.target.id === 'workspaceScroll' || ev.target.id === 'pagesZoomWrapper') {
        state.selectedSlotId = null;
        state.selectedRowId = null;
        document.querySelectorAll('.bento-row').forEach(el => el.classList.remove('selected-row'));
        document.querySelectorAll('.bento-slot').forEach(el => el.classList.remove('active-slot'));
        if (state.activeRibbonTab === 'formatar') state.activeRibbonTab = 'inserir';
        renderRibbonHeader();
      }
    }

    function insertOrTransformBlock(blockType) {
      const doc = getCurrentDoc();
      if (!doc) return;
      const spec = BLOCK_TYPES[blockType];
      if (!spec) return;

      let target = getSelectedSlotObj();
      if (!target) {
        const emptyFound = findFirstEmptySlot(doc);
        if (emptyFound) target = emptyFound;
        else {
          addRowWithLayout('12');
          target = getSelectedSlotObj();
        }
      } else if (target.slot.block !== null) {
        addRowWithLayout('12');
        target = getSelectedSlotObj();
      }

      target.slot.block = {
        type: blockType,
        numbered: spec.numbered,
        data: spec.defaultData()
      };

      state.selectedRowId = target.row.id;
      state.selectedSlotId = target.slot.id;
      state.activeRibbonTab = 'formatar';
      doc.updatedAt = Date.now();
      saveStorage();
      renderEditorAll();
    }

    function findFirstEmptySlot(doc) {
      for (const row of doc.rows) {
        for (const slot of row.slots) {
          if (!slot.block) return { row, slot };
        }
      }
      return null;
    }

    function toggleBlockNumbered(slotId, flag) {
      const obj = getSelectedSlotObj();
      if (!obj || obj.slot.id !== slotId || !obj.slot.block) return;
      obj.slot.block.numbered = flag;
      saveStorage();
      renderCanvasPages();
    }

    function updateBlockProp(slotId, prop, value, skipRender = false) {
      const doc = getCurrentDoc();
      if (!doc) return;
      for (const r of doc.rows) {
        for (const s of r.slots) {
          if (s.id === slotId && s.block) {
            s.block.data[prop] = value;
            doc.updatedAt = Date.now();
            saveStorage();
            if (!skipRender) renderEditorAll();
            return;
          }
        }
      }
    }

    function mutateBlockData(slotId, mutatorFn, skipRender = false) {
      const doc = getCurrentDoc();
      if (!doc) return;
      for (const r of doc.rows) {
        for (const s of r.slots) {
          if (s.id === slotId && s.block) {
            mutatorFn(s.block.data);
            doc.updatedAt = Date.now();
            saveStorage();
            if (!skipRender) renderEditorAll();
            return;
          }
        }
      }
    }

    /* MOTOR DE PAGINAÇÃO CORRIGIDO: Empilha os blocos na mesma página A4 até atingir 990px reais */
    function renderEditorAll() {
      renderRibbonHeader();
      renderCanvasPages();
    }

    function renderCanvasPages() {
      const doc = getCurrentDoc();
      if (!doc) return;
      const container = document.getElementById('a4PagesContainer');
      container.innerHTML = '';

      // Calcula numeração apenas para blocos que têm numbered=true e hideStatement=false
      let questionCounter = 1;
      const questionNumbersMap = {};
      for (const row of doc.rows) {
        for (const slot of row.slots) {
          if (slot.block && slot.block.numbered && !slot.block.data.hideStatement) {
            questionNumbersMap[slot.id] = questionCounter++;
          }
        }
      }

      const pages = [];
      let currentPage = createA4PageDOM(doc);
      container.appendChild(currentPage.pageEl);
      pages.push(currentPage);

      const MAX_CONTENT_PX = 995; // Altura útil real dentro da página A4 antes do rodapé

      for (const row of doc.rows) {
        const rowEl = buildBentoRowDOM(row, questionNumbersMap);
        currentPage.contentEl.appendChild(rowEl);

        // Como .a4-content agora tem flex-grow: 0, offsetHeight reflete 100% a soma real dos blocos!
        const usedHeight = currentPage.contentEl.offsetHeight;
        if (usedHeight > MAX_CONTENT_PX && currentPage.contentEl.children.length > 1) {
          currentPage.contentEl.removeChild(rowEl);
          currentPage = createA4PageDOM(doc);
          container.appendChild(currentPage.pageEl);
          pages.push(currentPage);
          currentPage.contentEl.appendChild(rowEl);
        }
      }

      // Barra rápida para adicionar faixa no final da folha ativa (apenas modo edição)
      if (state.viewMode === 'edit') {
        const addBar = document.createElement('div');
        addBar.className = 'no-print mt-2 pt-2 border-t border-dashed border-slate-200 flex items-center justify-center gap-2';
        addBar.innerHTML = `
          <button onclick="addRowWithLayout('12')" class="px-2.5 py-1 rounded bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-700 text-[11px] font-semibold transition">+ Faixa 100%</button>
          <button onclick="addRowWithLayout('6-6')" class="px-2.5 py-1 rounded bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-700 text-[11px] font-semibold transition">+ Faixa 50% / 50%</button>
          <button onclick="addRowWithLayout('4-4-4')" class="px-2.5 py-1 rounded bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-700 text-[11px] font-semibold transition">+ Faixa 33% x 3</button>
        `;
        currentPage.contentEl.appendChild(addBar);
      }

      const totalPages = pages.length;
      pages.forEach((p, idx) => {
        const pageSpan = p.pageEl.querySelector('.footer-page-span');
        if (pageSpan) {
          pageSpan.textContent = doc.settings.showPageNumbers ? `Página ${idx + 1} de ${totalPages}` : '';
        }
      });
    }

    function createA4PageDOM(doc) {
      const pageEl = document.createElement('div');
      pageEl.className = 'a4-page';

      const contentEl = document.createElement('div');
      contentEl.className = 'a4-content';

      const footerEl = document.createElement('div');
      footerEl.className = 'a4-footer';
      footerEl.innerHTML = `
        <span class="footer-left-span">${escapeHtml(doc.settings.footerLeft || '')}</span>
        <span class="footer-center-span font-medium">${escapeHtml(doc.settings.footerCenter || '')}</span>
        <span class="footer-page-span"></span>
      `;

      pageEl.appendChild(contentEl);
      pageEl.appendChild(footerEl);
      return { pageEl, contentEl };
    }

    function buildBentoRowDOM(row, questionNumbersMap) {
      const rowEl = document.createElement('div');
      rowEl.className = `bento-row ${state.selectedRowId === row.id ? 'selected-row' : ''}`;
      rowEl.dataset.rowId = row.id;

      for (const slot of row.slots) {
        const slotEl = document.createElement('div');
        slotEl.dataset.slotId = slot.id;
        slotEl.style.gridColumn = `span ${slot.span} / span ${slot.span}`;
        const isSelected = state.selectedSlotId === slot.id;

        if (!slot.block) {
          slotEl.className = `bento-slot empty-slot ${isSelected ? 'active-slot' : ''}`;
          slotEl.onclick = (ev) => selectSlot(row.id, slot.id, ev);
          slotEl.innerHTML = `
            <div class="text-center px-2 py-1.5 text-slate-400 flex items-center gap-1.5">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span class="text-[10px] font-semibold">Slot (${Math.round((slot.span/12)*100)}%) — Clique num módulo na barra superior</span>
            </div>
          `;
        } else {
          slotEl.className = `bento-slot p-1 ${isSelected ? 'active-slot' : ''}`;
          slotEl.onclick = (ev) => selectSlot(row.id, slot.id, ev);
          const qNum = questionNumbersMap[slot.id] || null;
          slotEl.innerHTML = renderBlockInnerHTML(slot, qNum);
        }

        rowEl.appendChild(slotEl);
      }

      return rowEl;
    }

    /* ============================================================================
       8. RENDERIZADORES WYSIWYG (SEM ELEMENTOS FANTASMAS E COM MULTI-ITENS)
       ============================================================================ */
    function renderQuestionHeaderInline(slot, qNum, placeholder = 'Digite o enunciado (ou oculte na barra superior)...') {
      const d = slot.block.data;
      if (d.hideStatement) return ''; // Modo "Item Livre": zero enunciado!

      const badge = qNum
        ? `<span class="inline-flex items-center justify-center bg-slate-900 text-white font-bold text-[10.5px] px-1.5 py-0.5 rounded mr-1.5 select-none">${qNum}.</span>`
        : '';
      return `
        <div class="text-xs leading-snug text-slate-900 mb-1.5 flex items-baseline">
          ${badge}
          <div contenteditable="true"
               data-placeholder="${placeholder}"
               oninput="updateBlockProp('${slot.id}', 'statement', this.innerText, true)"
               class="flex-1 font-semibold">${escapeHtml(d.statement || '')}</div>
        </div>
      `;
    }

    function renderMiniImageBox(imgUrl, onClickJsCode, sizeClass = 'w-12 h-12') {
      if (imgUrl) {
        return `
          <div onclick="${onClickJsCode}" title="Clique para trocar imagem" class="mini-img-slot ${sizeClass} border border-slate-300 bg-white">
            <img src="${imgUrl}" class="w-full h-full object-contain">
          </div>
        `;
      }
      return `
        <div onclick="${onClickJsCode}" title="Adicionar imagem neste item" class="mini-img-slot empty ${sizeClass}">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
      `;
    }

    function renderBlockInnerHTML(slot, qNum) {
      const b = slot.block;
      const d = b.data;
      const isTeacher = state.viewMode === 'teacher';

      switch (b.type) {
        // 1. CABEÇALHO ESCOLAR
        case 'cabecalho': {
          const logoEl = d.logoDataUrl
            ? `<img src="${d.logoDataUrl}" class="w-12 h-12 object-contain" alt="Logo">`
            : `<svg class="w-9 h-9 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`;

          if (d.style === 'compacto') {
            return `
              <div class="border-2 border-slate-800 rounded p-2 text-xs">
                <div class="flex items-center justify-between gap-2 border-b border-slate-400 pb-1 mb-1">
                  <div contenteditable="true" data-placeholder="NOME DA ESCOLA" oninput="updateBlockProp('${slot.id}', 'escola', this.innerText, true)" class="font-bold uppercase flex-1">${escapeHtml(d.escola)}</div>
                  <div class="whitespace-nowrap font-medium">Data: ___/___/______</div>
                </div>
                <div class="flex items-center justify-between gap-2">
                  <div class="flex-1">Estudante: _________________________________________________</div>
                  <div class="whitespace-nowrap">Turma: <span contenteditable="true" data-placeholder="____" oninput="updateBlockProp('${slot.id}', 'turma', this.innerText, true)" class="inline-block min-w-[35px] border-b border-slate-400 text-center">${escapeHtml(d.turma)}</span></div>
                </div>
              </div>
            `;
          }

          return `
            <div class="border-2 border-slate-800 rounded p-2.5 text-xs">
              <div class="flex items-center gap-3 border-b border-slate-400 pb-2 mb-2">
                <div onclick="pickImageFor(url => updateBlockProp('${slot.id}', 'logoDataUrl', url))" title="Clique para enviar brasão/logo" class="w-12 h-12 flex items-center justify-center border border-dashed border-slate-300 rounded cursor-pointer shrink-0 overflow-hidden">
                  ${logoEl}
                </div>
                <div class="flex-1">
                  <div contenteditable="true" data-placeholder="NOME DA INSTITUIÇÃO ESCOLAR" oninput="updateBlockProp('${slot.id}', 'escola', this.innerText, true)" class="font-extrabold text-sm uppercase tracking-wide text-slate-900">${escapeHtml(d.escola)}</div>
                  <div class="flex items-center gap-4 mt-1 text-[11px] text-slate-700">
                    <div class="flex items-center gap-1">Prof.(a): <span contenteditable="true" data-placeholder="_____________" oninput="updateBlockProp('${slot.id}', 'professor', this.innerText, true)" class="font-semibold text-slate-900">${escapeHtml(d.professor)}</span></div>
                    <div class="flex items-center gap-1">Turma: <span contenteditable="true" data-placeholder="_____" oninput="updateBlockProp('${slot.id}', 'turma', this.innerText, true)" class="font-semibold text-slate-900">${escapeHtml(d.turma)}</span></div>
                    <div class="flex items-center gap-1">Turno: <span contenteditable="true" data-placeholder="_____" oninput="updateBlockProp('${slot.id}', 'turno', this.innerText, true)" class="font-semibold text-slate-900">${escapeHtml(d.turno)}</span></div>
                  </div>
                </div>
                <div class="border border-slate-700 rounded px-2.5 py-1 text-center shrink-0">
                  <div class="text-[9px] font-bold uppercase text-slate-500">Nota</div>
                  <div class="h-5 w-12"></div>
                </div>
              </div>
              <div class="flex items-center justify-between gap-4 text-xs">
                <div class="flex-1 font-medium">Estudante: __________________________________________________________________</div>
                <div class="whitespace-nowrap font-medium">Data: ___/___/______</div>
              </div>
            </div>
          `;
        }

        // 2. QUADRO DE REGRAS
        case 'regras': {
          const listHtml = d.items.map((item, idx) => `
            <li class="flex items-start gap-1.5">
              <span class="font-bold text-slate-700">•</span>
              <div contenteditable="true" data-placeholder="Digite a orientação..." oninput="mutateBlockData('${slot.id}', data => data.items[${idx}] = this.innerText, true)" class="flex-1">${escapeHtml(item)}</div>
            </li>
          `).join('');
          return `
            <div class="border border-slate-700 bg-slate-50/70 rounded p-2 text-xs">
              <div contenteditable="true" data-placeholder="Título do quadro..." oninput="updateBlockProp('${slot.id}', 'title', this.innerText, true)" class="font-bold uppercase text-[11px] text-slate-800 mb-1 hide-when-empty">${escapeHtml(d.title)}</div>
              <ul class="space-y-0.5 text-[11px] text-slate-700 pl-1">${listHtml}</ul>
            </div>
          `;
        }

        // 3. TEXTO BASE (Sem fantasmas se Título ou Fonte ficarem em branco!)
        case 'texto_base': {
          return `
            <div class="border border-slate-300 rounded p-2.5 text-xs">
              <div contenteditable="true" data-placeholder="Título do texto (opcional)" oninput="updateBlockProp('${slot.id}', 'title', this.innerText, true)" class="font-bold text-center text-slate-900 mb-1 hide-when-empty">${escapeHtml(d.title)}</div>
              <div contenteditable="true" data-placeholder="Digite ou cole o texto de leitura..." oninput="updateBlockProp('${slot.id}', 'body', this.innerText, true)" class="text-[11.5px] leading-relaxed text-justify text-slate-800 whitespace-pre-wrap" style="column-count: ${d.columns || 1}; column-gap: 16px;">${escapeHtml(d.body)}</div>
              <div contenteditable="true" data-placeholder="Fonte / Referência (some na impressão se ficar vazio)" oninput="updateBlockProp('${slot.id}', 'source', this.innerText, true)" class="text-[9.5px] italic text-right text-slate-500 mt-1 hide-when-empty">${escapeHtml(d.source)}</div>
            </div>
          `;
        }

        // 4. DIVISOR
        case 'divisor': {
          return `
            <div class="bg-slate-800 text-white rounded px-3 py-1 text-xs font-bold uppercase tracking-wider text-center">
              <div contenteditable="true" data-placeholder="TÍTULO DA SEÇÃO / DISCIPLINA" oninput="updateBlockProp('${slot.id}', 'text', this.innerText, true)">${escapeHtml(d.text)}</div>
            </div>
          `;
        }

        // 5. ENUNCIADO LIVRE
        case 'enunciado': {
          return renderQuestionHeaderInline(slot, qNum, 'Digite o texto ou comando...');
        }

        // 6. MÚLTIPLA ESCOLHA
        case 'multipla_escolha': {
          const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
          const gridCols = d.columns === 4 ? 'grid-cols-4' : d.columns === 2 ? 'grid-cols-2' : 'grid-cols-1';
          const optsHtml = d.options.map((opt, idx) => {
            const isCorrect = d.correctIndex === idx;
            const markFill = (isTeacher && isCorrect) ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-700 text-slate-800';
            return `
              <div class="flex items-baseline gap-1.5 text-xs">
                <span onclick="updateBlockProp('${slot.id}', 'correctIndex', ${idx})" title="Clique para marcar como gabarito" class="w-4 h-4 rounded-full border ${markFill} inline-flex items-center justify-center text-[10px] font-bold cursor-pointer shrink-0">${letters[idx]}</span>
                <div contenteditable="true" data-placeholder="Alternativa ${letters[idx]}..." oninput="mutateBlockData('${slot.id}', data => data.options[${idx}] = this.innerText, true)" class="flex-1">${escapeHtml(opt)}</div>
              </div>
            `;
          }).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="grid ${gridCols} gap-1.5 pl-1">${optsHtml}</div>
            </div>
          `;
        }

        // 7. DISCURSIVA
        case 'discursiva': {
          let linesHtml = '';
          const count = d.linesCount || 4;
          for (let i = 0; i < count; i++) {
            if (d.lineType === 'caligraphy') {
              linesHtml += `<div class="caligraphy-row"></div>`;
            } else if (d.lineType === 'boxes') {
              linesHtml += `<div class="grid grid-cols-18 gap-0.5 my-1">${new Array(18).fill(0).map(() => `<div class="h-6 border border-slate-400"></div>`).join('')}</div>`;
            } else {
              const borderStyle = d.lineType === 'dashed' ? 'border-dashed' : 'border-solid';
              linesHtml += `<div class="h-6 border-b ${borderStyle} border-slate-400 flex items-end px-1 text-blue-700 font-semibold text-xs">${isTeacher && i === 0 ? escapeHtml(d.teacherAnswer || '') : ''}</div>`;
            }
          }
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div>${linesHtml}</div>
            </div>
          `;
        }

        // 8. VERDADEIRO OU FALSO
        case 'verdadeiro_falso': {
          const itemsHtml = d.items.map((it, idx) => `
            <div class="flex items-baseline gap-2 text-xs py-0.5">
              <button onclick="mutateBlockData('${slot.id}', data => data.items[${idx}].answer = data.items[${idx}].answer === 'V' ? 'F' : 'V')" class="font-mono font-bold text-slate-800 shrink-0">
                (${isTeacher ? `<span class="text-blue-700">${it.answer}</span>` : '&nbsp;&nbsp;&nbsp;'})
              </button>
              <div contenteditable="true" data-placeholder="Afirmação..." oninput="mutateBlockData('${slot.id}', data => data.items[${idx}].text = this.innerText, true)" class="flex-1">${escapeHtml(it.text)}</div>
            </div>
          `).join('');
          let extraLinesHtml = '';
          for (let i = 0; i < (d.extraLines || 0); i++) extraLinesHtml += `<div class="h-5 border-b border-slate-400"></div>`;
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="space-y-0.5 pl-1">${itemsHtml}</div>
              ${extraLinesHtml ? `<div class="mt-1">${extraLinesHtml}</div>` : ''}
            </div>
          `;
        }

        // 9. RELACIONAR COLUNAS (Agora suporta Imagem + Texto em qualquer um dos lados!)
        case 'relacionar_colunas': {
          const rowsHtml = d.pairs.map((p, idx) => {
            const leftUploadCode = `pickImageFor(url => mutateBlockData('${slot.id}', data => data.pairs[${idx}].leftImg = url))`;
            const rightUploadCode = `pickImageFor(url => mutateBlockData('${slot.id}', data => data.pairs[${idx}].rightImg = url))`;
            return `
              <div class="grid grid-cols-2 gap-4 items-center text-xs py-1 border-b border-dashed border-slate-200 last:border-none">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-800">(${idx + 1})</span>
                  ${renderMiniImageBox(p.leftImg, leftUploadCode, 'w-11 h-11')}
                  <div contenteditable="true" data-placeholder="Texto ou deixe só a imagem..." oninput="mutateBlockData('${slot.id}', data => data.pairs[${idx}].leftText = this.innerText, true)" class="flex-1 hide-when-empty">${escapeHtml(p.leftText || '')}</div>
                </div>
                <div class="flex items-center gap-2">
                  <span class="font-mono font-bold text-slate-800 shrink-0">(${isTeacher ? `<span class="text-blue-700">${escapeHtml(p.key || String(idx + 1))}</span>` : '&nbsp;&nbsp;&nbsp;'})</span>
                  ${renderMiniImageBox(p.rightImg, rightUploadCode, 'w-11 h-11')}
                  <div contenteditable="true" data-placeholder="Correspondente..." oninput="mutateBlockData('${slot.id}', data => data.pairs[${idx}].rightText = this.innerText, true)" class="flex-1 hide-when-empty">${escapeHtml(p.rightText || '')}</div>
                </div>
              </div>
            `;
          }).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="space-y-1">${rowsHtml}</div>
            </div>
          `;
        }

        // 10. LACUNAS
        case 'lacunas': {
          const matches = [...(d.rawText || '').matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
          const renderedText = escapeHtml(d.rawText || '').replace(/\[([^\]]+)\]/g, (_, word) => {
            if (isTeacher) return `<span class="underline font-bold text-blue-700 px-1">${word}</span>`;
            const lineLen = Math.max(6, word.length + 3);
            return `<span class="inline-block border-b border-slate-800 mx-1" style="width:${lineLen * 7}px"></span>`;
          });
          const bankHtml = (d.showWordBank && matches.length > 0) ? `
            <div class="border border-slate-400 bg-slate-50 rounded px-2.5 py-1 mb-1.5 text-xs flex flex-wrap items-center gap-2">
              <span class="font-bold uppercase text-[10px] text-slate-600">Banco:</span>
              ${matches.map(w => `<span class="px-2 py-0.5 bg-white border border-slate-300 rounded font-semibold">${escapeHtml(w)}</span>`).join('')}
            </div>
          ` : '';
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              ${bankHtml}
              ${state.viewMode === 'edit' ? `
                <div contenteditable="true" onblur="updateBlockProp('${slot.id}', 'rawText', this.innerText)" class="no-print text-xs p-1 border border-dashed border-blue-300 rounded bg-blue-50/20 mb-1">${escapeHtml(d.rawText)}</div>
              ` : ''}
              <div class="text-xs leading-loose text-slate-900">${renderedText}</div>
            </div>
          `;
        }

        // 11. CALIGRAFIA REFEITA (Edição fluida direto na pauta + Fonte MamaeQueNosFaz ou Bastão)
        case 'caligrafia': {
          const fontClass = d.fontStyle === 'bastao' ? 'font-bastao' : 'font-cursiva';
          const linesArr = d.lines || [{ text: '', emptyPracticeRows: 1 }];
          const linesHtml = linesArr.map((ln, idx) => `
            <div class="mb-1">
              <div class="caligraphy-row">
                <div contenteditable="true"
                     data-placeholder="Clique aqui e digite a palavra ou frase modelo..."
                     oninput="mutateBlockData('${slot.id}', data => data.lines[${idx}].text = this.innerText, true)"
                     class="w-full ${fontClass}">${escapeHtml(ln.text)}</div>
              </div>
              <div class="caligraphy-row"></div>
            </div>
          `).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div>${linesHtml}</div>
            </div>
          `;
        }

        // 12. GERADOR DE CAÇA-PALAVRAS AUTOMÁTICO
        case 'caca_palavras': {
          const gd = d.gridData || generateWordSearchMatrix(d.words || [], d.size || 10);
          const N = gd.grid.length;
          const cellsHtml = gd.grid.map((rowArr, r) =>
            rowArr.map((letter, c) => {
              const isTarget = gd.placedCells && gd.placedCells[`${r}_${c}`];
              const highlight = (isTeacher && isTarget) ? 'bg-blue-200 text-blue-900 font-extrabold' : 'bg-white text-slate-900 font-bold';
              return `<div class="w-6 h-6 border border-slate-500 flex items-center justify-center text-xs font-mono ${highlight}">${letter}</div>`;
            }).join('')
          ).join('');

          const bankHtml = d.showWordBank ? `
            <div class="border border-slate-400 bg-slate-50 rounded p-2 text-xs flex flex-wrap gap-1.5 items-center justify-center mb-2">
              <span class="font-bold uppercase text-[10px] text-slate-500 mr-1">Palavras:</span>
              ${(d.words || []).map(w => `<span class="px-2 py-0.5 bg-white border border-slate-300 rounded font-bold uppercase">${escapeHtml(w)}</span>`).join('')}
            </div>
          ` : '';

          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum, 'Encontre as palavras em destaque no diagrama abaixo:')}
              ${bankHtml}
              <div class="flex justify-center">
                <div class="inline-grid border border-slate-700" style="grid-template-columns: repeat(${N}, 1.5rem);">${cellsHtml}</div>
              </div>
            </div>
          `;
        }

        // 13. CONSCIÊNCIA FONOLÓGICA / SEGMENTAÇÃO DE SÍLABAS E LETRAS (Múltiplos Cartões!)
        case 'segmentacao_silabas': {
          const gridCols = d.cols === 3 ? 'grid-cols-3' : 'grid-cols-2';
          const cardsHtml = (d.items || []).map((it, idx) => {
            const syllables = String(it.word || '').toUpperCase().split('-').filter(Boolean);
            const letters = syllables.join('').split('');
            const uploadCode = `pickImageFor(url => mutateBlockData('${slot.id}', data => data.items[${idx}].img = url))`;

            const sylBoxes = syllables.map(s => `
              <div class="h-7 min-w-[34px] px-1 border-2 border-slate-800 rounded flex items-center justify-center font-bold text-xs text-blue-700">${isTeacher ? escapeHtml(s) : ''}</div>
            `).join('');

            const letBoxes = letters.map(l => `
              <div class="w-6 h-6 border border-slate-600 rounded flex items-center justify-center font-bold text-xs text-blue-700">${isTeacher ? escapeHtml(l) : ''}</div>
            `).join('');

            return `
              <div class="border border-slate-300 rounded p-2 flex items-center gap-2.5">
                ${renderMiniImageBox(it.img, uploadCode, 'w-14 h-14')}
                <div class="flex-1 space-y-1.5">
                  ${state.viewMode === 'edit' ? `
                    <input type="text" value="${escapeAttr(it.word)}" placeholder="Ex: SA-PO" onchange="mutateBlockData('${slot.id}', data => data.items[${idx}].word = this.value.toUpperCase())" class="no-print w-full border border-blue-300 rounded px-1.5 py-0.5 text-[10px] font-bold uppercase">
                  ` : ''}
                  ${(d.mode === 'both' || d.mode === 'syllables') ? `<div class="flex flex-wrap gap-1">${sylBoxes}</div>` : ''}
                  ${(d.mode === 'both' || d.mode === 'letters') ? `<div class="flex flex-wrap gap-1">${letBoxes}</div>` : ''}
                </div>
              </div>
            `;
          }).join('');

          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum, 'Observe as figuras e separe as palavras em sílabas e letras:')}
              <div class="grid ${gridCols} gap-2.5">${cardsHtml}</div>
            </div>
          `;
        }

        // 14. IDENTIFICAÇÃO DE LETRA / SÍLABA INICIAL (Grade com Múltiplos Cartões!)
        case 'inicial_vogal': {
          const gridCols = d.cols === 4 ? 'grid-cols-4' : d.cols === 2 ? 'grid-cols-2' : 'grid-cols-3';
          const cardsHtml = (d.items || []).map((it, idx) => {
            const uploadCode = `pickImageFor(url => mutateBlockData('${slot.id}', data => data.items[${idx}].img = url))`;
            const opts = it.options || ['A', 'E', 'I', 'O', 'U'];
            const bubbles = opts.map(letter => {
              const isTarget = String(it.target).toUpperCase() === String(letter).toUpperCase();
              const cls = (isTeacher && isTarget) ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-700 text-slate-800';
              return `
                <button onclick="mutateBlockData('${slot.id}', data => data.items[${idx}].target = '${letter}')" class="w-6 h-6 rounded-full border ${cls} font-bold text-xs flex items-center justify-center">${letter}</button>
              `;
            }).join('');

            return `
              <div class="border border-slate-300 rounded p-2 flex flex-col items-center gap-1.5 text-center">
                ${renderMiniImageBox(it.img, uploadCode, 'w-16 h-16')}
                <div contenteditable="true" data-placeholder="Nome/Dica (opcional)" oninput="mutateBlockData('${slot.id}', data => data.items[${idx}].label = this.innerText, true)" class="text-[11px] font-bold uppercase tracking-wider text-slate-700 hide-when-empty">${escapeHtml(it.label || '')}</div>
                <div class="flex items-center justify-center gap-1 flex-wrap mt-0.5">${bubbles}</div>
              </div>
            `;
          }).join('');

          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum, 'Pinte a letra inicial do nome de cada figura:')}
              <div class="grid ${gridCols} gap-2.5">${cardsHtml}</div>
            </div>
          `;
        }

        // 15. FORMAÇÃO DE PALAVRAS COM BANCO DE SÍLABAS
        case 'banco_silabas': {
          const bankHtml = `
            <div class="border-2 border-slate-700 bg-slate-50 rounded-lg p-2 mb-2 flex flex-wrap items-center justify-center gap-2">
              ${(d.syllables || []).map(syl => `<span class="px-2.5 py-1 bg-white border border-slate-500 rounded-full font-extrabold text-xs">${escapeHtml(syl)}</span>`).join('')}
            </div>
          `;
          const cardsHtml = (d.items || []).map((it, idx) => {
            const uploadCode = `pickImageFor(url => mutateBlockData('${slot.id}', data => data.items[${idx}].img = url))`;
            return `
              <div class="border border-slate-300 rounded p-2 flex flex-col items-center gap-2">
                ${renderMiniImageBox(it.img, uploadCode, 'w-14 h-14')}
                ${state.viewMode === 'edit' ? `<input type="text" value="${escapeAttr(it.answer || '')}" placeholder="Gabarito..." onchange="mutateBlockData('${slot.id}', data => data.items[${idx}].answer = this.value.toUpperCase(), true)" class="no-print w-full border rounded px-1 text-[10px] text-center font-bold uppercase">` : ''}
                <div class="w-full h-6 border-b-2 border-slate-800 text-center font-bold text-xs text-blue-700">${isTeacher ? escapeHtml(it.answer || '') : ''}</div>
              </div>
            `;
          }).join('');

          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum, 'Junte as sílabas do quadro e escreva o nome das figuras:')}
              ${bankHtml}
              <div class="grid grid-cols-3 gap-2.5">${cardsHtml}</div>
            </div>
          `;
        }

        // 16. MATRIZ DE ALGORITMOS ARMADOS
        case 'algoritmos': {
          const gridCols = d.cols === 4 ? 'grid-cols-4' : d.cols === 2 ? 'grid-cols-2' : 'grid-cols-3';
          const letters = ['a)', 'b)', 'c)', 'd)', 'e)', 'f)', 'g)', 'h)', 'i)', 'j)', 'k)', 'l)'];
          const cardsHtml = d.operations.map((item, idx) => `
            <div class="border border-slate-300 rounded p-2 flex flex-col justify-start">
              <div class="flex items-center justify-between text-[10px] font-bold text-slate-500 mb-1">
                <span>${letters[idx] || ''}</span>
                ${state.viewMode === 'edit' ? `
                  <div class="no-print flex items-center gap-0.5 bg-slate-100 rounded px-1 py-0.5">
                    <input type="text" value="${escapeAttr(item.a)}" onchange="mutateBlockData('${slot.id}', data => data.operations[${idx}].a = this.value)" class="w-10 text-center bg-white border border-slate-300 rounded text-[10px] font-mono">
                    <select onchange="mutateBlockData('${slot.id}', data => data.operations[${idx}].op = this.value)" class="bg-white border border-slate-300 rounded text-[10px] font-bold">
                      <option value="+" ${item.op === '+' ? 'selected' : ''}>+</option>
                      <option value="-" ${item.op === '-' ? 'selected' : ''}>-</option>
                      <option value="x" ${item.op === 'x' ? 'selected' : ''}>×</option>
                      <option value="/" ${item.op === '/' ? 'selected' : ''}>÷</option>
                    </select>
                    <input type="text" value="${escapeAttr(item.b)}" onchange="mutateBlockData('${slot.id}', data => data.operations[${idx}].b = this.value)" class="w-9 text-center bg-white border border-slate-300 rounded text-[10px] font-mono">
                  </div>
                ` : ''}
              </div>
              ${renderArmedOperationHTML(item, d.showQVL, d.showReserve, isTeacher)}
            </div>
          `).join('');

          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum, 'Arme e efetue as operações:')}
              <div class="grid ${gridCols} gap-2.5">${cardsHtml}</div>
            </div>
          `;
        }

        // 17 e 18. FRAÇÕES VISUAIS
        case 'fracao_visual':
        case 'fracao_pintar': {
          const isPaintMode = b.type === 'fracao_pintar';
          const itemsHtml = d.items.map((it, idx) => `
            <div class="border border-slate-300 rounded p-2 flex flex-col items-center gap-1.5">
              ${state.viewMode === 'edit' ? `
                <div class="no-print flex items-center gap-1 text-[10px]">
                  <input type="number" min="1" max="16" value="${it.num}" onchange="mutateBlockData('${slot.id}', data => data.items[${idx}].num = parseInt(this.value)||1)" class="w-9 border rounded text-center font-bold">
                  <span>/</span>
                  <input type="number" min="2" max="16" value="${it.den}" onchange="mutateBlockData('${slot.id}', data => data.items[${idx}].den = Math.max(2, parseInt(this.value)||2))" class="w-9 border rounded text-center font-bold">
                </div>
              ` : ''}
              ${renderFractionSVG(it.num, it.den, d.shape, !isPaintMode || isTeacher)}
              ${isPaintMode ? `
                <div class="inline-flex flex-col items-center font-mono font-bold text-xs leading-none">
                  <span class="border-b-2 border-slate-800 px-2 pb-0.5">${it.num}</span>
                  <span class="pt-0.5">${it.den}</span>
                </div>
              ` : `
                <div class="inline-flex flex-col items-center font-mono font-bold text-xs">
                  <span class="w-7 h-5 border border-slate-600 flex items-center justify-center text-blue-700">${isTeacher ? it.num : ''}</span>
                  <span class="w-8 border-t-2 border-slate-800 my-0.5"></span>
                  <span class="w-7 h-5 border border-slate-600 flex items-center justify-center text-blue-700">${isTeacher ? it.den : ''}</span>
                </div>
              `}
            </div>
          `).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">${itemsHtml}</div>
            </div>
          `;
        }

        // 19. FRAÇÕES EQUIVALENTES
        case 'fracao_equivalente': {
          const itemsHtml = d.items.map((it, idx) => {
            const box = (val, isMissing) => isMissing
              ? `<span class="w-7 h-6 border-2 border-slate-800 rounded inline-flex items-center justify-center text-blue-700 font-bold">${isTeacher ? val : ''}</span>`
              : `<span class="px-1.5 font-bold">${val}</span>`;
            return `
              <div class="border border-slate-300 rounded p-2 flex flex-col items-center">
                ${state.viewMode === 'edit' ? `
                  <div class="no-print flex items-center gap-0.5 text-[10px] mb-1">
                    <input type="number" value="${it.n1}" onchange="mutateBlockData('${slot.id}', data => data.items[${idx}].n1 = parseInt(this.value)||1)" class="w-7 border rounded text-center">
                    <span>/</span>
                    <input type="number" value="${it.d1}" onchange="mutateBlockData('${slot.id}', data => data.items[${idx}].d1 = parseInt(this.value)||2)" class="w-7 border rounded text-center">
                    <span>=</span>
                    <input type="number" value="${it.n2}" onchange="mutateBlockData('${slot.id}', data => data.items[${idx}].n2 = parseInt(this.value)||2)" class="w-7 border rounded text-center">
                    <span>/</span>
                    <input type="number" value="${it.d2}" onchange="mutateBlockData('${slot.id}', data => data.items[${idx}].d2 = parseInt(this.value)||4)" class="w-7 border rounded text-center">
                  </div>
                ` : ''}
                <div class="flex items-center gap-2 font-mono text-sm">
                  <div class="flex flex-col items-center">${box(it.n1, false)}<span class="w-7 border-t-2 border-slate-800 my-0.5"></span>${box(it.d1, false)}</div>
                  <span class="font-bold">=</span>
                  <div class="flex flex-col items-center">
                    <span onclick="mutateBlockData('${slot.id}', data => data.items[${idx}].missing = 'n2')" class="cursor-pointer">${box(it.n2, it.missing === 'n2')}</span>
                    <span class="w-7 border-t-2 border-slate-800 my-0.5"></span>
                    <span onclick="mutateBlockData('${slot.id}', data => data.items[${idx}].missing = 'd2')" class="cursor-pointer">${box(it.d2, it.missing === 'd2')}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="grid grid-cols-3 gap-2">${itemsHtml}</div>
            </div>
          `;
        }

        // 20. EXPRESSÕES E INCÓGNITAS
        case 'expressoes_incognita': {
          const itemsHtml = d.items.map((it, idx) => {
            let wsLines = '';
            for (let l = 0; l < (d.workspaceLines || 2); l++) {
              wsLines += `<div class="h-5 border-b border-dashed border-slate-300 flex items-end text-blue-700 font-mono text-xs">${isTeacher && l === 0 ? `Resp: ${escapeHtml(it.answer)}` : ''}</div>`;
            }
            return `
              <div class="border border-slate-300 rounded p-2">
                <div class="flex items-center justify-between gap-2 font-mono font-bold text-xs">
                  <div contenteditable="true" oninput="mutateBlockData('${slot.id}', data => data.items[${idx}].expr = this.innerText, true)" class="flex-1">${escapeHtml(it.expr)}</div>
                  ${state.viewMode === 'edit' ? `<input type="text" value="${escapeAttr(it.answer)}" placeholder="Resp" onchange="mutateBlockData('${slot.id}', data => data.items[${idx}].answer = this.value, true)" class="no-print w-12 border rounded px-1 text-[10px]">` : ''}
                </div>
                <div class="mt-1">${wsLines}</div>
              </div>
            `;
          }).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="grid grid-cols-2 gap-2">${itemsHtml}</div>
            </div>
          `;
        }

        // 21. POLÍGONOS REGULARES
        case 'poligonos_regulares': {
          const polyNames = { 3: 'Triângulo', 4: 'Quadrilátero', 5: 'Pentágono', 6: 'Hexágono', 7: 'Heptágono', 8: 'Octógono', 9: 'Eneágono', 10: 'Decágono' };
          const itemsHtml = d.polygons.map((sides) => {
            const name = polyNames[sides] || `${sides} lados`;
            return `
              <div class="border border-slate-300 rounded p-2 flex flex-col items-center text-center">
                ${renderRegularPolygonSVG(sides)}
                ${d.askSidesAndVertices ? `
                  <div class="w-full text-[10px] text-left space-y-1 mt-1">
                    <div>Nome: <span class="border-b border-slate-500 inline-block w-20 text-blue-700 font-bold text-center">${isTeacher ? name : ''}</span></div>
                    <div>Lados: <span class="border-b border-slate-500 inline-block w-6 text-blue-700 font-bold text-center">${isTeacher ? sides : ''}</span> | Vért.: <span class="border-b border-slate-500 inline-block w-6 text-blue-700 font-bold text-center">${isTeacher ? sides : ''}</span></div>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="grid grid-cols-3 sm:grid-cols-5 gap-2">${itemsHtml}</div>
            </div>
          `;
        }

        // 22. RETA NUMÉRICA (Agora suporta Múltiplas Retas dentro da mesma questão!)
        case 'reta_numerica': {
          const linesArr = d.lines || [{ start: d.start || 0, step: d.step || 5, count: d.count || 8, hiddenIndices: d.hiddenIndices || [2, 5] }];
          const linesHtml = linesArr.map((ln, lIdx) => {
            const count = ln.count || 8;
            const hidden = ln.hiddenIndices || [];
            let ticksHtml = '';
            for (let i = 0; i < count; i++) {
              const val = ln.start + (i * ln.step);
              const isHidden = hidden.includes(i);
              ticksHtml += `
                <div onclick="toggleMultiNumberLineHidden('${slot.id}', ${lIdx}, ${i})" class="flex flex-col items-center cursor-pointer">
                  <div class="w-0.5 h-3 bg-slate-800"></div>
                  <div class="mt-1 ${isHidden ? 'w-9 h-6 border-2 border-slate-800 rounded flex items-center justify-center font-bold text-xs text-blue-700' : 'text-xs font-mono font-bold text-slate-900'}">
                    ${isHidden ? (isTeacher ? val : '') : val}
                  </div>
                </div>
              `;
            }
            return `
              <div class="py-1.5">
                ${state.viewMode === 'edit' ? `
                  <div class="no-print flex items-center gap-2 text-[10px] text-slate-500 mb-1">
                    <span>Início: <input type="number" value="${ln.start}" onchange="mutateBlockData('${slot.id}', data => data.lines[${lIdx}].start = parseInt(this.value)||0)" class="w-12 border rounded text-center font-bold"></span>
                    <span>Salto: <input type="number" min="1" value="${ln.step}" onchange="mutateBlockData('${slot.id}', data => data.lines[${lIdx}].step = Math.max(1, parseInt(this.value)||1))" class="w-12 border rounded text-center font-bold"></span>
                  </div>
                ` : ''}
                <div class="relative pt-2 pb-1 px-3">
                  <div class="h-0.5 bg-slate-800 w-full relative top-1.5"></div>
                  <div class="flex items-start justify-between relative z-10">${ticksHtml}</div>
                </div>
              </div>
            `;
          }).join('');

          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="space-y-1">${linesHtml}</div>
            </div>
          `;
        }

        // 23. MATERIAL DOURADO
        case 'material_dourado': {
          const cardsHtml = d.numbers.map((num, idx) => {
            const c = Math.floor((num % 1000) / 100);
            const dez = Math.floor((num % 100) / 10);
            const u = num % 10;
            return `
              <div class="border border-slate-300 rounded p-2 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 flex-wrap">
                  ${state.viewMode === 'edit' ? `<input type="number" min="1" max="999" value="${num}" onchange="mutateBlockData('${slot.id}', data => data.numbers[${idx}] = parseInt(this.value)||1)" class="no-print w-14 border rounded text-xs font-bold text-center">` : ''}
                  ${renderGoldenMaterialSVG(c, dez, u)}
                </div>
                <div class="w-14 h-8 border-2 border-slate-800 rounded flex items-center justify-center font-mono font-bold text-sm text-blue-700 shrink-0">${isTeacher ? num : ''}</div>
              </div>
            `;
          }).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="grid grid-cols-2 gap-2">${cardsHtml}</div>
            </div>
          `;
        }

        // 24. ÁBACO DE PINOS
        case 'abaco_pinos': {
          const cardsHtml = d.numbers.map((num, idx) => `
            <div class="border border-slate-300 rounded p-2 flex flex-col items-center">
              ${state.viewMode === 'edit' ? `<input type="number" min="0" max="9999" value="${num}" onchange="mutateBlockData('${slot.id}', data => data.numbers[${idx}] = parseInt(this.value)||0)" class="no-print w-16 border rounded text-xs font-bold text-center mb-1">` : ''}
              ${renderAbacusSVG(num, d.mode === 'read' || isTeacher)}
              <div class="mt-1 w-20 h-6 border-2 border-slate-800 rounded flex items-center justify-center font-mono font-bold text-xs text-blue-700">${d.mode === 'draw' || isTeacher ? num : ''}</div>
            </div>
          `).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="grid grid-cols-3 gap-2">${cardsHtml}</div>
            </div>
          `;
        }

        // 25. MALHA QUADRICULADA
        case 'malha_quadriculada': {
          const cols = d.cols || 18, rows = d.rows || 6;
          const gridEl = d.gridType === 'dots'
            ? `<div class="grid gap-3 p-2 border border-slate-300 rounded justify-items-center" style="grid-template-columns: repeat(${cols}, minmax(0, 1fr));">${new Array(cols * rows).fill(0).map(() => `<div class="w-1 h-1 rounded-full bg-slate-600"></div>`).join('')}</div>`
            : `<div class="grid border-t border-l border-slate-400" style="grid-template-columns: repeat(${cols}, minmax(0, 1fr));">${new Array(cols * rows).fill(0).map(() => `<div class="h-5 border-r border-b border-slate-400"></div>`).join('')}</div>`;
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div>${gridEl}</div>
            </div>
          `;
        }

        // 26. TABELA
        case 'tabela': {
          const rowsHtml = d.cells.map((rowArr, rIdx) => {
            const isHeader = rIdx === 0 && d.shadedHeader;
            const cellsHtml = rowArr.map((cellVal, cIdx) => `
              <td class="border border-slate-600 px-2 py-1 text-xs ${isHeader ? 'bg-slate-200 font-bold text-center' : ''}">
                <div contenteditable="true" data-placeholder="..." oninput="mutateBlockData('${slot.id}', data => data.cells[${rIdx}][${cIdx}] = this.innerText, true)">${escapeHtml(cellVal)}</div>
              </td>
            `).join('');
            return `<tr>${cellsHtml}</tr>`;
          }).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <table class="w-full border-collapse">${rowsHtml}</table>
            </div>
          `;
        }

        // 27. MAPA MENTAL
        case 'mapa_mental': {
          const branchesHtml = d.branches.map((br, idx) => `
            <div class="border-2 ${br.blank ? 'border-dashed border-slate-700' : 'border-slate-800 bg-slate-50'} rounded-lg p-2 flex items-center justify-between gap-1">
              <div contenteditable="true" data-placeholder="Conceito..." oninput="mutateBlockData('${slot.id}', data => data.branches[${idx}].title = this.innerText, true)" class="text-xs font-semibold flex-1 text-center ${br.blank && !isTeacher ? 'opacity-20 no-print' : ''}">${br.blank && !isTeacher ? '' : escapeHtml(br.title)}</div>
              <button onclick="mutateBlockData('${slot.id}', data => data.branches[${idx}].blank = !data.branches[${idx}].blank)" class="no-print text-[9px] px-1.5 py-0.5 rounded bg-slate-200 font-bold">${br.blank ? 'Lacuna' : 'Fixo'}</button>
            </div>
          `).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="flex flex-col items-center gap-2">
                <div class="border-2 border-slate-900 bg-slate-900 text-white rounded-full px-5 py-1 text-xs font-extrabold uppercase">
                  <div contenteditable="true" oninput="updateBlockProp('${slot.id}', 'centerTitle', this.innerText, true)">${escapeHtml(d.centerTitle)}</div>
                </div>
                <div class="grid grid-cols-2 gap-2.5 w-full">${branchesHtml}</div>
              </div>
            </div>
          `;
        }

        // 28. LINHA DO TEMPO (Agora com suporte a Imagem opcional + Subtexto em cada Marco!)
        case 'linha_tempo': {
          const cols = d.events.length;
          const eventsHtml = d.events.map((ev, idx) => {
            const uploadCode = `pickImageFor(url => mutateBlockData('${slot.id}', data => data.events[${idx}].img = url))`;
            return `
              <div class="flex flex-col items-center text-center px-1">
                <div contenteditable="true" data-placeholder="Data/Ano" oninput="mutateBlockData('${slot.id}', data => data.events[${idx}].date = this.innerText, true)" class="text-xs font-extrabold text-slate-900 mb-1">${escapeHtml(ev.date)}</div>
                <div class="w-3 h-3 rounded-full bg-slate-900 border-2 border-white shadow mb-1"></div>
                <div class="w-full border border-slate-500 rounded p-1.5 min-h-[42px] text-[11px] flex flex-col items-center justify-between gap-1">
                  ${renderMiniImageBox(ev.img, uploadCode, 'w-14 h-12')}
                  <div contenteditable="true" data-placeholder="Subtexto..." oninput="mutateBlockData('${slot.id}', data => data.events[${idx}].label = this.innerText, true)" class="w-full ${ev.hideLabel && !isTeacher ? 'invisible' : 'hide-when-empty'}">${escapeHtml(ev.label)}</div>
                  <button onclick="mutateBlockData('${slot.id}', data => data.events[${idx}].hideLabel = !data.events[${idx}].hideLabel)" class="no-print text-[9px] text-blue-600 font-bold">${ev.hideLabel ? 'Lacuna p/ Aluno' : 'Visível'}</button>
                </div>
              </div>
            `;
          }).join('');
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="grid gap-2 pt-1" style="grid-template-columns: repeat(${cols}, minmax(0, 1fr));">${eventsHtml}</div>
            </div>
          `;
        }

        // 29. IMAGEM OU QUADRO (Legenda some se ficar vazia!)
        case 'imagem_quadro': {
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              ${d.mode === 'image' && d.imageUrl ? `
                <div class="flex flex-col items-center">
                  <img src="${d.imageUrl}" style="max-height: ${(d.boxHeightCm || 4) * 37.8}px;" class="object-contain rounded ${d.photocopyFilter ? 'photocopy-filter' : ''}">
                  <div contenteditable="true" data-placeholder="Fonte/Legenda (some na impressão se ficar vazio)" oninput="updateBlockProp('${slot.id}', 'caption', this.innerText, true)" class="text-[10px] italic text-slate-500 mt-0.5 hide-when-empty">${escapeHtml(d.caption || '')}</div>
                </div>
              ` : `
                <div onclick="pickImageFor(url => mutateBlockData('${slot.id}', data => { data.mode='image'; data.imageUrl=url; }))" style="height: ${d.boxHeightCm || 4}cm;" class="border-2 border-slate-700 rounded flex items-center justify-center text-slate-300 cursor-pointer">
                  <span class="no-print text-[11px] text-slate-400">Quadro Livre (${d.boxHeightCm || 4}cm) — Clique para subir Imagem</span>
                </div>
              `}
            </div>
          `;
        }

        // 30. TIRINHA / HQ
        case 'tirinha_hq': {
          const count = d.framesCount || 3;
          let framesHtml = '';
          for (let i = 0; i < count; i++) {
            framesHtml += `
              <div style="height: ${d.heightCm || 4.2}cm;" class="border-2 border-slate-800 rounded p-2 flex flex-col justify-start">
                ${d.speechBubbles ? `<div class="border border-slate-700 rounded-2xl h-9 w-4/5 mx-auto bg-white"></div>` : ''}
              </div>
            `;
          }
          return `
            <div>
              ${renderQuestionHeaderInline(slot, qNum)}
              <div class="grid gap-2" style="grid-template-columns: repeat(${count}, minmax(0, 1fr));">${framesHtml}</div>
            </div>
          `;
        }
      }
      return '';
    }

    /* ============================================================================
       9. MOTORES AUXILIARES (CAÇA-PALAVRAS, MATEMÁTICA E IMAGENS)
       ============================================================================ */
    function updateWordSearchWords(slotId, rawCSV) {
      mutateBlockData(slotId, data => {
        data.words = rawCSV.split(',').map(w => w.trim().toUpperCase()).filter(Boolean);
        data.gridData = generateWordSearchMatrix(data.words, data.size || 10);
      });
    }

    function updateWordSearchSize(slotId, newSize) {
      mutateBlockData(slotId, data => {
        data.size = newSize;
        data.gridData = generateWordSearchMatrix(data.words, newSize);
      });
    }

    function regenerateWordSearch(slotId) {
      mutateBlockData(slotId, data => {
        data.gridData = generateWordSearchMatrix(data.words, data.size || 10);
      });
    }

    function toggleMultiNumberLineHidden(slotId, lineIdx, ptIndex) {
      mutateBlockData(slotId, data => {
        if (!data.lines) data.lines = [{ start: 0, step: 5, count: 8, hiddenIndices: [2, 5] }];
        const arr = data.lines[lineIdx].hiddenIndices || [];
        const i = arr.indexOf(ptIndex);
        if (i >= 0) arr.splice(i, 1);
        else arr.push(ptIndex);
        data.lines[lineIdx].hiddenIndices = arr;
      });
    }

    function renderArmedOperationHTML(item, showQVL, showReserve, isTeacher) {
      const aNum = parseInt(String(item.a).replace(/\D/g, ''), 10) || 0;
      const bNum = parseInt(String(item.b).replace(/\D/g, ''), 10) || 1;
      const op = item.op || '+';

      if (op === '/') {
        const quo = Math.floor(aNum / bNum);
        const rem = aNum % bNum;
        return `
          <div class="flex flex-col justify-start items-center pt-1 pb-10 math-mono text-sm">
            <div class="inline-grid grid-cols-2 items-start">
              <div class="pr-2 pt-0.5 text-right font-bold tracking-widest text-slate-900">
                ${aNum}
                ${isTeacher ? `<div class="text-xs text-blue-700 mt-3">(${rem})</div>` : ''}
              </div>
              <div class="border-l-2 border-b-2 border-slate-900 pl-2 pr-3 py-0.5 font-bold text-slate-900 min-w-[44px]">${bNum}</div>
              <div></div>
              <div class="pl-2 pt-1 font-bold text-blue-700 min-h-[22px]">${isTeacher ? quo : ''}</div>
            </div>
          </div>
        `;
      }

      let res = op === '+' ? aNum + bNum : op === '-' ? aNum - bNum : aNum * bNum;
      const maxLen = Math.max(String(aNum).length, String(bNum).length, String(res).length, 3);
      const padA = String(aNum).padStart(maxLen, ' ');
      const padB = String(bNum).padStart(maxLen, ' ');
      const padR = String(res).padStart(maxLen, ' ');
      const qvlLabels = ['U', 'D', 'C', 'UM', 'DM'];
      const headers = new Array(maxLen).fill(0).map((_, i) => qvlLabels[maxLen - 1 - i] || '');
      const signSymbol = op === 'x' ? '×' : op;

      return `
        <div class="flex flex-col items-center justify-center py-0.5 math-mono">
          <table class="border-collapse text-sm">
            ${showQVL ? `<tr><td></td>${headers.map(h => `<td class="text-center text-[9px] font-bold text-slate-500 border border-slate-300 bg-slate-50 px-1.5">${h}</td>`).join('')}</tr>` : ''}
            ${showReserve ? `<tr><td></td>${headers.map((_, idx) => `<td class="p-0.5 text-center">${idx < maxLen - 1 ? `<div class="w-3.5 h-3.5 rounded-full border border-dashed border-slate-400 mx-auto"></div>` : ''}</td>`).join('')}</tr>` : ''}
            <tr><td></td>${padA.split('').map(ch => `<td class="px-1.5 py-0.5 text-center font-bold text-slate-900 ${showQVL ? 'border border-slate-300' : ''}">${ch === ' ' ? '' : ch}</td>`).join('')}</tr>
            <tr class="border-b-2 border-slate-900"><td class="pr-1 font-bold text-slate-900">${signSymbol}</td>${padB.split('').map(ch => `<td class="px-1.5 py-0.5 text-center font-bold text-slate-900 ${showQVL ? 'border border-slate-300' : ''}">${ch === ' ' ? '' : ch}</td>`).join('')}</tr>
            <tr><td></td>${padR.split('').map(ch => `<td class="px-1.5 py-1 text-center font-bold text-blue-700 h-6 ${showQVL ? 'border border-slate-300' : ''}">${isTeacher ? (ch === ' ' ? '' : ch) : ''}</td>`).join('')}</tr>
          </table>
        </div>
      `;
    }

    function renderFractionSVG(num, den, shape, fillPainted) {
      const n = Math.min(den, Math.max(0, num));
      if (shape === 'bar') {
        const w = 108, h = 24, sliceW = w / den;
        let rects = '';
        for (let i = 0; i < den; i++) {
          rects += `<rect x="${i * sliceW}" y="0" width="${sliceW}" height="${h}" fill="${(fillPainted && i < n) ? '#94a3b8' : '#ffffff'}" stroke="#1e293b" stroke-width="1.4"/>`;
        }
        return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${rects}</svg>`;
      }
      const r = 24, cx = 28, cy = 28;
      let paths = '';
      for (let i = 0; i < den; i++) {
        const a1 = (i * 2 * Math.PI) / den - Math.PI / 2;
        const a2 = ((i + 1) * 2 * Math.PI) / den - Math.PI / 2;
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
        paths += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${(a2 - a1) > Math.PI ? 1 : 0} 1 ${x2} ${y2} Z" fill="${(fillPainted && i < n) ? '#94a3b8' : '#ffffff'}" stroke="#1e293b" stroke-width="1.3"/>`;
      }
      return `<svg width="56" height="56" viewBox="0 0 56 56">${paths}</svg>`;
    }

    function renderRegularPolygonSVG(sides) {
      const n = Math.max(3, Math.min(12, sides));
      const cx = 30, cy = 30, r = 24;
      const pts = [];
      for (let i = 0; i < n; i++) {
        const angle = (i * 2 * Math.PI) / n - Math.PI / 2;
        pts.push(`${(cx + r * Math.cos(angle)).toFixed(1)},${(cy + r * Math.sin(angle)).toFixed(1)}`);
      }
      return `<svg width="60" height="60" viewBox="0 0 60 60"><polygon points="${pts.join(' ')}" fill="#f8fafc" stroke="#0f172a" stroke-width="1.8"/></svg>`;
    }

    function renderGoldenMaterialSVG(c, d, u) {
      let html = '<div class="flex items-end gap-1 flex-wrap">';
      for (let i = 0; i < Math.min(c, 4); i++) html += `<div class="w-7 h-7 border border-slate-800 bg-slate-100"></div>`;
      for (let i = 0; i < Math.min(d, 9); i++) html += `<div class="w-2 h-7 border border-slate-800 bg-slate-200"></div>`;
      if (u > 0) html += `<div class="grid grid-cols-3 gap-0.5">${new Array(Math.min(u, 9)).fill(0).map(() => `<div class="w-2 h-2 border border-slate-800 bg-slate-300"></div>`).join('')}</div>`;
      html += '</div>';
      return html;
    }

    function renderAbacusSVG(num, showBeads) {
      const digits = String(num).padStart(4, '0').slice(-4).split('').map(Number);
      const labels = ['UM', 'C', 'D', 'U'];
      let rods = '';
      digits.forEach((dig, idx) => {
        const x = 18 + idx * 24;
        rods += `<line x1="${x}" y1="10" x2="${x}" y2="62" stroke="#334155" stroke-width="2"/>`;
        rods += `<text x="${x}" y="75" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0f172a">${labels[idx]}</text>`;
        if (showBeads) {
          for (let b = 0; b < dig; b++) {
            rods += `<ellipse cx="${x}" cy="${57 - b * 5}" rx="7" ry="2.2" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>`;
          }
        }
      });
      return `<svg width="108" height="80" viewBox="0 0 108 80">${rods}<rect x="6" y="62" width="96" height="3.5" fill="#0f172a" rx="1"/></svg>`;
    }

    /* Seletor universal de imagens por callback (funciona em qualquer sub-item!) */
    function pickImageFor(callbackFn) {
      state.imageCallback = callbackFn;
      document.getElementById('hiddenImageInput').click();
    }

    function handleGlobalImageUpload(ev) {
      const file = ev.target.files?.[0];
      if (!file || !state.imageCallback) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.imageCallback(reader.result);
        state.imageCallback = null;
        ev.target.value = '';
      };
      reader.readAsDataURL(file);
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      document.body.classList.toggle('edit-mode', mode === 'edit');
      renderEditorAll();
    }

    function setZoom(z) {
      state.zoom = Math.min(1.5, Math.max(0.45, z));
      document.getElementById('pagesZoomWrapper').style.transform = `scale(${state.zoom})`;
      renderRibbonHeader();
    }

    function adjustZoom(delta) {
      setZoom(state.zoom + delta);
    }

    function fitCanvasToViewport() {
      const ws = document.getElementById('workspaceScroll');
      if (!ws) return;
      const availableW = ws.clientWidth - 32;
      const best = Math.min(1, Math.max(0.45, availableW / 794));
      setZoom(best);
    }

    /* ============================================================================
       10. MODAIS DE SISTEMA (JSON E CONFIRMAÇÃO NATIVA) E PONTE KODULAR
       ============================================================================ */
    function openJsonDialog(mode = 'import') {
      state.dialogAllowOutsideClose = true;
      const backdrop = document.getElementById('systemDialogBackdrop');
      const doc = getCurrentDoc();
      const jsonStr = mode === 'export' && doc ? JSON.stringify(doc, null, 2) : '';

      document.getElementById('sysDialogTitle').textContent = mode === 'export' ? 'Exportar / Copiar Código JSON' : 'Importar / Colar JSON';
      document.getElementById('sysDialogBody').innerHTML = `
        <textarea id="jsonDialogTextarea" rows="8" class="w-full border border-slate-300 rounded-lg p-2.5 font-mono text-[11px] bg-slate-50" placeholder='{"title": "...", "rows": [...]}'>${escapeHtml(jsonStr)}</textarea>
        ${mode === 'import' ? `<input type="file" accept=".json,application/json" onchange="loadJsonFileIntoTextarea(event)" class="text-xs text-slate-600">` : ''}
      `;
      document.getElementById('sysDialogFooter').innerHTML = mode === 'export' ? `
        <button onclick="closeSystemDialog()" class="px-3 py-1.5 rounded border border-slate-300 text-xs font-semibold text-slate-600">Fechar</button>
        <button onclick="copyJsonFromDialog()" class="px-3 py-1.5 rounded bg-slate-800 text-white text-xs font-semibold">Copiar Código</button>
        <button onclick="downloadJsonFromDialog()" class="px-3 py-1.5 rounded bg-blue-600 text-white text-xs font-semibold">Baixar .JSON</button>
      ` : `
        <button onclick="closeSystemDialog()" class="px-3 py-1.5 rounded border border-slate-300 text-xs font-semibold text-slate-600">Cancelar</button>
        <button onclick="confirmJsonImport()" class="px-3 py-1.5 rounded bg-blue-600 text-white text-xs font-semibold">Carregar Atividade</button>
      `;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function loadJsonFileIntoTextarea(ev) {
      const f = ev.target.files?.[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { document.getElementById('jsonDialogTextarea').value = r.result; };
      r.readAsText(f);
    }

    function copyJsonFromDialog() {
      const ta = document.getElementById('jsonDialogTextarea');
      if (ta) { ta.select(); navigator.clipboard?.writeText(ta.value); }
      closeSystemDialog();
    }

    function downloadJsonFromDialog() {
      const doc = getCurrentDoc();
      if (!doc) return;
      const blob = new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(doc.title || 'atividade').toLowerCase().replace(/\s+/g, '_')}.json`;
      a.click();
      closeSystemDialog();
    }

    function confirmJsonImport() {
      const ta = document.getElementById('jsonDialogTextarea');
      if (!ta || !ta.value.trim()) return;
      try {
        const parsed = JSON.parse(ta.value);
        if (!parsed.rows || !Array.isArray(parsed.rows)) throw new Error('Inválido');
        parsed.id = uid();
        parsed.updatedAt = Date.now();
        state.activities.unshift(parsed);
        saveStorage();
        closeSystemDialog();
        openActivity(parsed.id);
      } catch (e) {
        openConfirmDialog('JSON Inválido', 'Verifique o código colado e tente novamente.', null, true);
      }
    }

    function openConfirmDialog(title, message, onConfirm, alertOnly = false) {
      state.dialogAllowOutsideClose = false;
      const backdrop = document.getElementById('systemDialogBackdrop');
      document.getElementById('sysDialogTitle').textContent = title;
      document.getElementById('sysDialogBody').innerHTML = `<p class="text-slate-700 text-xs leading-relaxed">${escapeHtml(message)}</p>`;
      document.getElementById('sysDialogFooter').innerHTML = alertOnly ? `
        <button onclick="closeSystemDialog()" class="px-4 py-1.5 rounded bg-blue-600 text-white text-xs font-semibold">Entendi</button>
      ` : `
        <button onclick="closeSystemDialog()" class="px-3 py-1.5 rounded border border-slate-300 text-xs font-semibold text-slate-600">Cancelar</button>
        <button id="sysConfirmActionBtn" class="px-3 py-1.5 rounded bg-red-600 text-white text-xs font-semibold">Confirmar</button>
      `;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
      if (!alertOnly && onConfirm) {
        document.getElementById('sysConfirmActionBtn').onclick = () => {
          closeSystemDialog();
          onConfirm();
        };
      }
    }

    function clearCurrentDocumentConfirm() {
      openConfirmDialog('Limpar Folha', 'Deseja remover todos os blocos desta atividade?', () => {
        const doc = getCurrentDoc();
        if (!doc) return;
        const fresh = createBlankDocument(doc.subject);
        doc.rows = fresh.rows;
        state.selectedRowId = doc.rows[0].id;
        state.selectedSlotId = doc.rows[0].slots[0].id;
        saveStorage();
        renderEditorAll();
      });
    }

    function handleBackdropClick() {
      if (state.dialogAllowOutsideClose) closeSystemDialog();
    }

    function closeSystemDialog() {
      const backdrop = document.getElementById('systemDialogBackdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    window.receberTextoDoKodular = function(texto) {
      if (!texto) return;
      try {
        const parsed = JSON.parse(texto);
        if (parsed && parsed.rows) {
          parsed.id = uid();
          state.activities.unshift(parsed);
          saveStorage();
          openActivity(parsed.id);
        }
      } catch (e) {}
    };

    window.handleAndroidBack = function() {
      const backdrop = document.getElementById('systemDialogBackdrop');
      if (!backdrop.classList.contains('hidden')) {
        closeSystemDialog();
        return;
      }
      if (state.currentId !== null) {
        if (state.selectedSlotId !== null) {
          state.selectedSlotId = null;
          state.selectedRowId = null;
          if (state.activeRibbonTab === 'formatar') state.activeRibbonTab = 'inserir';
          renderEditorAll();
          return;
        }
        goHome();
        return;
      }
      if (window.AppInventor && window.AppInventor.setWebViewString) {
        window.AppInventor.setWebViewString('VOLTAR_MENU');
      }
    };

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escapeAttr(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.addEventListener('resize', () => {
      if (state.currentId !== null) fitCanvasToViewport();
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      renderHomeView();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
